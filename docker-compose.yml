services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Définir MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: amani_services
      MYSQL_USER: amani_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définir MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm start"
    environment:
      PORT: 4000
      NODE_ENV: development
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: amani_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Définir MYSQL_PASSWORD}
      MYSQL_DATABASE: amani_services
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  mysql_data:
  api_node_modules:
  web_node_modules:
