# Two services; MySQL is hosted externally on Aiven.
services:
  - type: web
    name: amani-services-api
    runtime: node
    rootDir: backend
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: amani-uploads
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: defaultdb
      - key: MYSQL_SSL_CA
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: amani-services-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
